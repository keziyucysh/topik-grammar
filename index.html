<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="韓檢初級文法複習：分類瀏覽、逐句韓語朗讀、中文翻譯與漢字詞。">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<title>韓檢初級文法</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="韓檢文法">
<meta name="theme-color" content="#F4EFE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E1915" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one-column phone notebook — sticky header, fixed bottom tab bar, content max 560px.
   Palette: oat-paper ground, cream cards, milk-tea / linen-grey surfaces, caramel accent, cocoa ink. */
:root{
  --bg:#F4EFE6;       /* 燕麥米 */
  --card:#FBF8F3;     /* 卡片 */
  --milk:#D9C4A9;     /* 奶茶 */
  --linen:#CFC6B8;    /* 米灰 */
  --caramel:#A0754F;  /* 焦糖棕 */
  --ink:#4A3A2E;      /* 深咖啡 */
  --muted:#7D6B5D;    /* 次要文字 */
  --hl:#EBD9BF;       /* 文法重點底色 */
  --line:#E4DACB;
  --soft:#EFE6D8;
  --cat1:#E3D2BB; --cat2:#DDD5C8; --cat3:#E8DCC6; --cat4:#D8C2A8;
  --on-accent:#FBF8F3;
  --bad:#A4553F;
  --gram:#B23F27;     /* 文法字詞（磚紅） */
  --gram-bg:#F6E3DA;
  --shadow:0 1px 2px rgba(74,58,46,.06),0 6px 18px rgba(74,58,46,.07);
  --f-ko:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans TC',sans-serif;
  --f-zh:'Noto Sans TC','PingFang TC','Microsoft JhengHei','Noto Sans KR',sans-serif;
  --hdrh:56px; --navh:62px;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1E1915; --card:#29221C; --milk:#6A5541; --linen:#4A4038; --caramel:#D4A67C; --ink:#EFE5D8; --muted:#B8A795;
    --hl:#4E3C2B; --line:#3A3029; --soft:#322922; --cat1:#3B3027; --cat2:#35302B; --cat3:#3A3229; --cat4:#43342A;
    --on-accent:#1E1915; --bad:#D98C74; --gram:#FF8F73; --gram-bg:#4A2A20; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1E1915; --card:#29221C; --milk:#6A5541; --linen:#4A4038; --caramel:#D4A67C; --ink:#EFE5D8; --muted:#B8A795;
  --hl:#4E3C2B; --line:#3A3029; --soft:#322922; --cat1:#3B3027; --cat2:#35302B; --cat3:#3A3229; --cat4:#43342A;
  --on-accent:#1E1915; --bad:#D98C74; --gram:#FF8F73; --gram-bg:#4A2A20; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-zh);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--caramel);outline-offset:2px;border-radius:8px}
.ko{font-family:var(--f-ko);word-break:keep-all;overflow-wrap:anywhere}
svg{display:block}

/* ---------- header ---------- */
#hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid transparent;transition:border-color .2s}
#hdr.scrolled{border-bottom-color:var(--line)}
.hdr-in{max-width:560px;margin:0 auto;padding-inline:16px;height:var(--hdrh);display:flex;align-items:center;gap:8px}
.hdr-title{flex:1;min-width:0;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-sub{font-weight:500;color:var(--muted);font-size:13px;margin-left:6px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;color:var(--ink)}
.icon-btn:active{background:var(--soft)}
.icon-btn.on{color:var(--caramel)}

/* ---------- main ---------- */
main{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:8px calc(var(--navh) + env(safe-area-inset-bottom,0px) + 28px)}

/* ---------- bottom nav ---------- */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--navh)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--caramel);font-weight:700}

/* ---------- home ---------- */
.hero{padding:10px 2px 18px}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:500}
.hero h1{font-size:28px;line-height:1.25;margin:6px 0 2px;letter-spacing:.02em;text-wrap:balance}
.hero .ko-sub{font-family:var(--f-ko);color:var(--muted);font-size:14px}
.overall{margin-top:16px;background:var(--card);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow);display:grid;gap:10px}
.overall-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.big-num{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.big-num small{font-size:14px;color:var(--muted);font-weight:500;margin-left:2px}
.mini-stats{display:flex;gap:14px;color:var(--muted);font-size:13px}
.mini-stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--caramel);border-radius:99px;min-width:0;transition:width .4s}
.resume{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:12px;padding:12px 14px;border-radius:var(--r-md);border:1px dashed var(--linen);color:var(--muted);font-size:13.5px}
.resume b{color:var(--ink);font-weight:500}
.resume .ko{color:var(--ink);font-weight:700}
.resume svg{margin-left:auto;flex:none;color:var(--caramel)}
.sec-label{font-size:12.5px;letter-spacing:.12em;color:var(--muted);margin:26px 2px 10px;font-weight:500}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{position:relative;text-align:left;border-radius:var(--r-lg);padding:16px 14px 14px;display:flex;flex-direction:column;gap:2px;min-height:150px;overflow:hidden}
.cat:active{transform:scale(.985)}
.cat .cat-ko{font-family:var(--f-ko);font-size:13px;color:var(--muted);letter-spacing:.06em}
.cat .cat-zh{font-size:21px;font-weight:700;line-height:1.3}
.cat .cat-count{font-size:12.5px;color:var(--muted);margin-top:auto;font-variant-numeric:tabular-nums}
.cat .bar{margin-top:8px;background:rgba(255,255,255,.45)}
:root[data-theme="dark"] .cat .bar{background:rgba(0,0,0,.25)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cat .bar{background:rgba(0,0,0,.25)}}
.cat .glyph{position:absolute;right:-6px;top:-14px;font-family:var(--f-ko);font-weight:700;font-size:74px;line-height:1;opacity:.13;pointer-events:none}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--card);color:var(--muted);letter-spacing:.04em;width:max-content}

/* ---------- list ---------- */
.list-head{padding:6px 2px 14px}
.list-head h1{font-size:24px;margin:0;line-height:1.3}
.list-head p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.rows{display:grid;gap:8px}
.row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border-radius:var(--r-md);padding:12px 12px 12px 10px;box-shadow:0 1px 0 var(--line)}
.row:active{background:var(--soft)}
.row-main{min-width:0;display:flex;flex-direction:column}
.row-title{font-size:16.5px;font-weight:700;line-height:1.4}
.row-mean{font-size:12.5px;color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row-state{display:flex;gap:4px;color:var(--caramel)}
.row-state svg{width:17px;height:17px}
.row.pending .row-title{color:var(--muted);font-weight:500}
.stamp{display:inline-flex;align-items:center;gap:3px;border:1.5px solid var(--ink);border-radius:4px;padding:1px 6px 1px 5px;font-size:11px;font-weight:700;line-height:1.3;letter-spacing:.02em;flex:none}
.stamp b{font-size:15px;font-variant-numeric:tabular-nums;letter-spacing:0}
.row .stamp{flex-direction:column;gap:0;padding:3px 0;width:42px;justify-content:center;border-color:var(--linen);color:var(--muted)}
.row .stamp b{color:var(--ink);font-size:17px}
.row.done .stamp{background:var(--hl);border-color:var(--milk)}

/* ---------- detail ---------- */
.g-head{padding:6px 2px 14px}
.g-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--milk);color:var(--ink);letter-spacing:.04em}
.g-title{font-size:30px;line-height:1.3;margin:10px 0 4px;font-weight:700;text-wrap:balance}
.g-meaning{margin:0;color:var(--muted);font-size:15px}
.g-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.toggle{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:99px;border:1px solid var(--linen);font-size:13.5px;color:var(--muted);background:var(--card)}
.toggle svg{width:16px;height:16px}
.toggle.on{background:var(--caramel);border-color:var(--caramel);color:var(--on-accent)}
.rule{display:flex;gap:10px;align-items:flex-start;background:var(--card);border-radius:var(--r-md);padding:12px 14px;margin-bottom:10px;font-size:14px;line-height:1.7}
.rule-tag{flex:none;font-size:12px;font-weight:700;color:var(--on-accent);background:var(--ink);border-radius:4px;padding:1px 6px;margin-top:3px;letter-spacing:.08em}
.rule-text{min-width:0;font-family:var(--f-ko)}
.tipbox{border:1.5px dashed var(--linen);border-radius:var(--r-md);padding:12px 14px 10px;margin:10px 0;font-size:13.5px;line-height:1.75;position:relative}
.tipbox .tip-tag{display:inline-block;font-weight:700;font-size:12px;color:var(--caramel);border:1.5px solid var(--caramel);border-radius:4px;padding:0 6px;margin-bottom:6px;letter-spacing:.04em}
.tipbox ul{margin:0;padding-left:1.1em}
.tipbox li{font-family:var(--f-ko)}
.tipbox li::marker{color:var(--milk)}

.toolbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdrh));z-index:15;background:var(--bg);margin-inline:-16px;padding:8px 16px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.play-all{display:inline-flex;align-items:center;gap:6px;background:var(--caramel);color:var(--on-accent);border-radius:99px;padding:8px 14px 8px 11px;font-size:13.5px;font-weight:500}
.play-all svg{width:18px;height:18px}
.seg{display:inline-flex;background:var(--soft);border-radius:99px;padding:3px}
.seg button{font-size:12.5px;padding:5px 10px;border-radius:99px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(74,58,46,.12)}
.hide-zh{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.switch{width:36px;height:22px;border-radius:99px;background:var(--linen);position:relative;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--card);transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.hide-zh.on .switch{background:var(--caramel)}
.hide-zh.on .switch::after{transform:translateX(14px)}

.usage{margin-top:22px}
.usage-h{display:flex;gap:10px;align-items:flex-start;margin:0 0 10px;font-size:15.5px;line-height:1.55;font-weight:700}
.usage-h .num{flex:none;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:13px;margin-top:1px;font-variant-numeric:tabular-nums}
.usage-h .txt{min-width:0}
.usage.cont{margin-top:12px}
.usage.cont .usage-h{font-size:14px;color:var(--muted);font-weight:500;padding-left:34px}
.exs{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ex{background:var(--card);border-radius:var(--r-md);padding:12px 8px 12px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 6px;border:1.5px solid transparent;transition:border-color .2s,background .2s;scroll-margin-top:calc(var(--hdrh) + 70px)}
.ex-body{min-width:0;cursor:default}
.ex-ko{font-size:19px;line-height:1.7;font-weight:500;margin:0}
.ex-zh{margin:10px 0 0;color:var(--ink);font-size:15px;line-height:1.6}
.il{display:flex;flex-wrap:wrap;column-gap:.5em;row-gap:10px;align-items:flex-start}
.tok{display:inline-flex;flex-direction:column;align-items:flex-start;min-width:0;max-width:100%}
.tk{font-size:19px;line-height:1.45;font-weight:500;white-space:nowrap}
.tok.has .tk{border-bottom:1.5px solid var(--milk);padding-bottom:1px}
.tg{font-family:var(--f-zh);font-size:11.5px;line-height:1.35;color:var(--muted);margin-top:3px;max-width:7.5em;overflow-wrap:anywhere;font-weight:400}
.tg .h{color:var(--caramel)}
.tg .sep{color:var(--linen)}
.il mark.hl{text-decoration:none;background:none}
.il .gk{text-decoration:none;background:var(--gram-bg);border-radius:4px;padding:0 1px}
.hidezh .ex:not(.revealed) .tg{display:none}
.hidezh .ex:not(.revealed) .tok.has .tk{border-bottom-color:transparent}
.ex.bad .ex-ko.il{text-decoration:none}
.ex.bad .tk{text-decoration:line-through;text-decoration-color:var(--bad);color:var(--muted)}
.ex-hj{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:6px}
.hj{font-size:12.5px;line-height:1.45;padding:3px 8px;border-radius:7px;background:var(--soft);color:var(--muted);max-width:100%}
.hj .w{font-family:var(--f-ko);margin-right:4px}
.hj .c{color:var(--ink);font-weight:500}
.hj .h{color:var(--caramel);font-weight:500}
.ex.bad .hj{background:var(--card)}
.fc-back .ex-hj{margin-top:0}
.ex-note{font-size:12px;color:var(--muted);margin-top:4px}
.ex-note::before{content:"補充";font-size:10.5px;border:1px solid var(--linen);border-radius:3px;padding:0 4px;margin-right:6px}
.ex.bad{background:var(--soft)}
.ex.bad .ex-ko{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--bad);text-decoration-thickness:1.5px}
.ex.bad mark.hl{background:none;text-decoration:line-through;text-decoration-color:var(--bad)}
.bad-tag{display:inline-block;font-size:11.5px;font-weight:700;color:var(--bad);border:1.5px solid var(--bad);border-radius:4px;padding:0 6px;margin-bottom:4px;letter-spacing:.04em}
.peek{display:none;margin-top:4px;font-size:12.5px;color:var(--caramel);letter-spacing:.04em}
.hidezh .ex:not(.revealed) .ex-zh,.hidezh .ex:not(.revealed) .ex-hj,.hidezh .ex:not(.revealed) .ex-note{display:none}
.hidezh .ex:not(.revealed) .peek{display:block}
.hidezh .ex-body{cursor:pointer}
.say{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--caramel);background:var(--soft);align-self:start;flex:none}
.say svg{width:20px;height:20px}
.say:active{transform:scale(.94)}
.ex.speaking{border-color:var(--caramel);background:var(--card)}
.ex.speaking .say{background:var(--caramel);color:var(--on-accent)}
.ex.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{background:var(--hl)}100%{background:var(--card)}}
mark.hl{background:none;color:inherit;text-decoration:underline;text-decoration-color:var(--milk);text-decoration-thickness:2px;text-underline-offset:5px}
.gk{color:var(--gram);font-weight:700;text-decoration:underline;text-decoration-color:var(--gram);text-decoration-thickness:2.5px;text-underline-offset:5px}
.pending-note{margin-top:14px;background:var(--card);border-radius:var(--r-lg);padding:22px 18px;text-align:center;color:var(--muted);font-size:14px;line-height:1.7}
.pending-note .big{font-size:32px;font-family:var(--f-ko);color:var(--milk);font-weight:700;display:block;margin-bottom:4px}
.g-foot{margin-top:28px;display:grid;gap:10px}
.done-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:var(--r-md);border:1.5px solid var(--caramel);color:var(--caramel);font-weight:700;font-size:15px}
.done-btn.on{background:var(--caramel);color:var(--on-accent)}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pn button{background:var(--card);border-radius:var(--r-md);padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:0;min-width:0}
.pn button:last-child{text-align:right;align-items:flex-end}
.pn small{color:var(--muted);font-size:12px}
.pn .ko{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pn button[disabled]{visibility:hidden}

.voice-hint{background:var(--hl);border-radius:var(--r-md);padding:12px 14px;margin:12px 0 0;font-size:13.5px;line-height:1.7}
.voice-hint summary{cursor:pointer;font-weight:700}
.voice-hint ol{margin:6px 0 0;padding-left:1.2em}

/* ---------- search ---------- */
.search-box{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdrh));z-index:15;background:var(--bg);margin-inline:-16px;padding:4px 16px 10px}
.search-field{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:99px;padding:0 14px;height:46px}
.search-field:focus-within{border-color:var(--caramel)}
.search-field>svg{color:var(--muted);flex:none;width:20px;height:20px}
.search-field input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;color:var(--ink);outline:none}
.search-field input::placeholder{color:var(--muted);opacity:.8}
.clear-q{color:var(--muted);width:28px;height:28px;display:grid;place-items:center;border-radius:50%}
.suggest{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.suggest button{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13.5px}
.res-h{font-size:12.5px;letter-spacing:.1em;color:var(--muted);margin:18px 2px 8px;font-weight:500}
.hit{display:block;width:100%;text-align:left;background:var(--card);border-radius:var(--r-md);padding:12px 14px;margin-bottom:8px}
.hit .ko{font-size:16.5px;line-height:1.6}
.hit .zh{color:var(--muted);font-size:13.5px}
.hit .from{font-size:11.5px;color:var(--caramel);margin-top:4px;letter-spacing:.03em}
.hit .from .ko{font-size:inherit;line-height:inherit}
mark.q{background:var(--milk);color:inherit;border-radius:3px;padding:0 1px}
.empty{color:var(--muted);text-align:center;padding:36px 12px;font-size:14px;line-height:1.8}

/* ---------- fav ---------- */
.segwide{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:99px;padding:4px;margin:6px 0 14px}
.segwide button{padding:8px;border-radius:99px;font-size:14px;color:var(--muted)}
.segwide button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(74,58,46,.12)}
.row .row-cat{font-size:11px;color:var(--caramel);letter-spacing:.04em}

/* ---------- review ---------- */
.scope{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.scope button{border:1px solid var(--linen);border-radius:99px;padding:6px 12px;font-size:13.5px;color:var(--muted);background:var(--card)}
.scope button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.scope button[disabled]{opacity:.45;cursor:not-allowed}
.flash-card{position:relative;background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:24px 20px 20px;min-height:340px;display:flex;flex-direction:column;cursor:pointer;border-left:6px solid var(--milk)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fc-count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.06em}
.fc-ko{font-size:24px;line-height:1.7;font-weight:500;margin:22px 0 0}
.fc-back{margin-top:auto;padding-top:16px;border-top:1.5px dashed var(--linen);display:grid;gap:8px}
.fc-zh{font-size:16px;line-height:1.6}
.fc-g{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.fc-g .ko{color:var(--ink);font-weight:700;font-size:15px}
.fc-usage{font-size:12.5px;color:var(--muted);line-height:1.6}
.fc-hint{margin-top:auto;text-align:center;color:var(--caramel);font-size:13px;letter-spacing:.06em;padding-top:18px}
.flash-card:not(.flipped) .fc-back{display:none}
.flash-card.flipped .fc-hint{display:none}
.flash-card.flipped .fc-back{animation:rise .35s ease}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fc-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border-radius:var(--r-md);font-weight:700;font-size:15px}
.btn.primary{background:var(--caramel);color:var(--on-accent)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn svg{width:18px;height:18px}

.toast{position:fixed;left:50%;bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13.5px;z-index:40;max-width:calc(100% - 32px);text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (min-width:430px){.cats{gap:14px}.cat{min-height:160px}}

/* standalone page reset */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* ================= data model ================= */
const CATS = [

  {key:'negation',  zh:'否定詞',   ko:'부정어',   glyph:'안', color:'var(--cat2)', data:NEGATION},
  {key:'connective',zh:'連接詞尾', ko:'연결어미', glyph:'고', color:'var(--cat3)', data:CONNECTIVE},
  {key:'ending',    zh:'語尾',     ko:'어미',     glyph:'요', color:'var(--cat4)', data:ENDING},
];
const G = [];           // all grammars
const GBY = {};         // id -> grammar
const EX = [];          // all examples (flattened)
CATS.forEach(c=>{
  c.items = [];
  const src = c.data ? c.data.map(g=>Object.assign({ready:true},g))
                     : c.index.map(([no,title,meaning])=>({no,title,meaning,ready:false,usages:[]}));
  src.forEach(g=>{
    g.id = c.key+'-'+g.no; g.cat = c;
    g.exIdx = [];
    // merge label-less continuation blocks into the previous usage
    const us = [];
    (g.usages||[]).forEach(u=>{
      if(u.cont && !u.label && us.length){ const p=us[us.length-1]; p.ex = p.ex.concat(u.ex); if(u.tips) p.tips=(p.tips||[]).concat(u.tips); }
      else us.push(Object.assign({}, u, {ex:u.ex.slice()}));
    });
    g.usages = us;
    let n=0;
    us.forEach(u=>{ if(!u.cont) n++; u.n = n;
      u.ex.forEach(e=>{ e.i = EX.length; e.g = g; e.u = u; EX.push(e); g.exIdx.push(e.i); });
    });
    c.items.push(g); G.push(g); GBY[g.id]=g;
  });
  c.ready = c.items.filter(g=>g.ready).length;
});

/* ================= helpers ================= */
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const view = $('#view'), hdrIn = $('#hdrIn');
function keyRanges(T, spec){
  if(!spec) return null;
  const found=[];
  spec.keys.forEach(k=>{
    if(k instanceof RegExp){ const m=T.match(k); if(m) found.push([m.index, m.index+m[0].length]); return; }
    let i=T.indexOf(k); while(i>=0){ found.push([i,i+k.length]); i=T.indexOf(k,i+1); }
  });
  if(!found.length) return null;
  if(spec.mode==='last'){ found.sort((a,b)=> b[1]-a[1] || (b[1]-b[0])-(a[1]-a[0])); return [found[0]]; }
  found.sort((a,b)=> (b[1]-b[0])-(a[1]-a[0]) || a[0]-b[0]);
  const out=[]; found.forEach(r=>{ if(!out.some(o=>r[0]<o[1] && r[1]>o[0])) out.push(r); });
  return out.sort((a,b)=>a[0]-b[0]);
}
function markChunk(T, gid){
  const rs = keyRanges(T, GKEYS[gid]);
  if(!rs) return (GKEYS[gid] && GKEYS[gid].fallback==='none') ? esc(T) : '<b class="gk">'+esc(T)+'</b>';
  let out='', p=0;
  rs.forEach(([a,b])=>{ out += esc(T.slice(p,a)) + '<b class="gk">' + esc(T.slice(a,b)) + '</b>'; p=b; });
  return out + esc(T.slice(p));
}
function masks(ko, hls, gid){
  const M = new Uint8Array(ko.length);          // 0 plain, 1 underlined chunk, 2 grammar word (red)
  const rs=[];
  (hls||[]).forEach(h=>{
    let i = ko.indexOf(h);
    while(i>=0 && rs.some(r=>i<r[1] && i+h.length>r[0])) i = ko.indexOf(h, i+1);
    if(i>=0) rs.push([i, i+h.length]);
  });
  const spec = GKEYS[gid];
  rs.forEach(([a,b])=>{
    for(let k=a;k<b;k++) M[k]=1;
    const kr = keyRanges(ko.slice(a,b), spec);
    if(kr) kr.forEach(([x,y])=>{ for(let k=a+x;k<a+y;k++) M[k]=2; });
    else if(!(spec && spec.fallback==='none')) for(let k=a;k<b;k++) M[k]=2;
  });
  return M;
}
function renderSpan(ko, M, a, b){
  let out='', k=a;
  while(k<b){
    const st=M[k]; let j=k; while(j<b && M[j]===st) j++;
    const t=esc(ko.slice(k,j));
    out += st===2 ? '<b class="gk">'+t+'</b>' : st===1 ? '<mark class="hl">'+t+'</mark>' : t;
    k=j;
  }
  return out;
}
function markKo(ko, hls, gid){ return renderSpan(ko, masks(ko, hls, gid), 0, ko.length); }
const glText = g => g.map(([w,m,h])=>esc(m||w)+(h?'<span class="h">（'+esc(h)+'）</span>':'')).join('<span class="sep">・</span>');
function ilHtml(e){
  if(!e.cols || !e.cols.length) return '<p class="ex-ko ko" lang="ko">'+markKo(e.ko, e.hl, e.g.id)+'</p>';
  const ko=e.ko, toks=ko.split(' '), off=[]; let p=0;
  toks.forEach(t=>{ off.push(p); p+=t.length+1; });
  const M = masks(ko, e.hl, e.g.id);
  return '<div class="il ex-ko ko" lang="ko">' + e.cols.map(([s,n,g])=>{
    const a=off[s], b=off[s+n-1]+toks[s+n-1].length;
    return '<span class="tok'+(g.length?' has':'')+'"><span class="tk">'+renderSpan(ko,M,a,b)+'</span>'+(g.length?'<span class="tg" lang="zh-Hant">'+glText(g)+'</span>':'')+'</span>';
  }).join('') + '</div>';
}
function markQ(text, q){
  if(!q) return esc(text);
  const lo = text.toLowerCase(), ql = q.toLowerCase();
  let out='', p=0, i=lo.indexOf(ql);
  while(i>=0){ out += esc(text.slice(p,i)) + '<mark class="q">' + esc(text.slice(i,i+q.length)) + '</mark>'; p=i+q.length; i=lo.indexOf(ql,p); }
  return out + esc(text.slice(p));
}
const hjHtml = e => {
  const L = (e.gl && e.gl.length) ? e.gl : e.hj.map(([w,c])=>[w,'',c]);
  if(!L.length) return '';
  return '<div class="ex-hj" aria-label="單字">'+L.map(([w,m,h])=>'<span class="hj"><span class="w">'+esc(w)+'</span>'+(m?'<span class="c">'+esc(m)+'</span>':'')+(h?'<span class="h">（'+esc(h)+'）</span>':'')+'</span>').join('')+'</div>';
};
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1800); }
const doneCount = c => c.items.filter(g=>S.done.has(g.id)).length;
const pct = (a,b)=> b ? Math.round(a/b*100) : 0;

/* ================= speech ================= */
const TTS = {
  ok: 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window,
  voice:null, loaded:false, missing:false, cur:null, queue:null,
  init(){
    if(!this.ok) return;
    const load=()=>{
      let vs=[]; try{ vs = speechSynthesis.getVoices()||[]; }catch(e){}
      if(vs.length){
        this.loaded = true;
        this.voice = vs.find(v=>/^ko([-_]|$)/i.test(v.lang) && /google/i.test(v.name)) || vs.find(v=>/^ko([-_]|$)/i.test(v.lang)) || null;
        this.missing = !this.voice;
        document.querySelectorAll('[data-voice-hint]').forEach(el=>el.hidden = !this.missing);
      }
    };
    load();
    try{ speechSynthesis.addEventListener('voiceschanged', load); }catch(e){ speechSynthesis.onvoiceschanged = load; }
    setTimeout(load, 700); setTimeout(load, 2000);
  },
  clean(t){ return t.replace(/\s*=\s*/g,'. ').replace(/\//g,', ').replace(/[()~]/g,' ').replace(/\.{2,}/g,'…'); },
  speak(text, onend){
    if(!this.ok){ toast('這個瀏覽器不支援朗讀'); onend&&onend(); return; }
    try{ speechSynthesis.cancel(); }catch(e){}
    const u = new SpeechSynthesisUtterance(this.clean(text));
    u.lang = 'ko-KR'; if(this.voice) u.voice = this.voice; u.rate = S.rate; u.pitch = 1;
    this.cur = u;
    const fin = ()=>{ if(this.cur!==u) return; this.cur=null; onend&&onend(); };
    u.onend = fin;
    u.onerror = (ev)=>{ if(ev && ev.error && !/interrupt|cancel/.test(ev.error) && !this.voice){ this.missing=true; document.querySelectorAll('[data-voice-hint]').forEach(el=>el.hidden=false); } fin(); };
    setTimeout(()=>{ if(this.cur===u) try{ speechSynthesis.speak(u); }catch(e){ fin(); } }, 40);
  },
  stop(){ this.queue=null; this.cur=null; if(this.ok) try{ speechSynthesis.cancel(); }catch(e){} setSpeaking(null); updatePlayBtn(); }
};
function setSpeaking(row){ document.querySelectorAll('.ex.speaking').forEach(r=>r.classList.remove('speaking')); if(row) row.classList.add('speaking'); }
const reduceMotion = ()=> window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function speakRow(row){
  TTS.queue = null; updatePlayBtn();
  const e = EX[+row.dataset.ex];
  setSpeaking(row);
  TTS.speak(e.ko, ()=>setSpeaking(null));
}
function playAll(){
  if(TTS.queue){ TTS.stop(); return; }
  const rows = [...view.querySelectorAll('.ex[data-ex]:not(.bad)')];
  if(!rows.length) return;
  const q = {rows, i:0}; TTS.queue = q;
  const step = ()=>{
    if(TTS.queue!==q) return;
    if(q.i>=q.rows.length){ TTS.queue=null; setSpeaking(null); updatePlayBtn(); return; }
    const row = q.rows[q.i]; setSpeaking(row);
    row.scrollIntoView({block:'center', behavior: reduceMotion()?'auto':'smooth'});
    TTS.speak(EX[+row.dataset.ex].ko, ()=>{ if(TTS.queue!==q) return; q.i++; setTimeout(step, 500); });
  };
  updatePlayBtn(); step();
}
function updatePlayBtn(){
  const b = view.querySelector('.play-all'); if(!b) return;
  b.innerHTML = TTS.queue ? I.stop+'停止' : I.play+'全部播放';
  b.setAttribute('aria-pressed', TTS.queue?'true':'false');
}
const voiceHint = ()=> `<details class="voice-hint" data-voice-hint ${TTS.missing?'':'hidden'}>
  <summary>找不到韓文語音，點這裡看怎麼安裝</summary>
  <ol>
    <li><b>iPhone / iPad：</b>設定 → 輔助使用 → 朗讀內容 → 聲音 → 韓文，下載一個語音（例如 Yuna）。</li>
    <li><b>Android：</b>設定 → 系統 → 語言與輸入法 → 文字轉語音輸出 → Google 語音服務 → 安裝語音資料 → 韓文。（各品牌選單名稱略有不同）</li>
    <li>裝好後重新開啟這個頁面。</li>
  </ol>
</details>`;

/* ================= routing ================= */
let route = {name:'home'};
let stack = [];
const scrollMem = {};
const rkey = r => r.name+':'+(r.id||r.cat||'');
function go(r, opts={}){
  TTS.stop();
  scrollMem[rkey(route)] = window.scrollY;
  if(opts.reset) stack = [];
  else if(!opts.back) stack.push(route);
  route = r;
  render();
  const y = opts.back ? (scrollMem[rkey(r)]||0) : 0;
  window.scrollTo(0, y);
  if(opts.focusEx!=null){
    const el = view.querySelector('.ex[data-ex="'+opts.focusEx+'"]');
    if(el){ if(S.hideZh) el.classList.add('revealed'); requestAnimationFrame(()=>{ el.scrollIntoView({block:'center'}); el.classList.add('flash'); }); }
  }
}
function back(){ const r = stack.pop(); if(r) go(r,{back:true}); else go({name:'home'},{reset:true}); }
const tabOf = r => r.tab || ({search:'search', fav:'fav', review:'review'}[r.name]) || 'home';

function renderTabs(){
  const t = tabOf(route);
  const tabs = [['home','首頁',I.home],['search','搜尋',I.search],['fav','收藏',I.star],['review','隨機複習',I.shuffle]];
  $('#tabsIn').innerHTML = tabs.map(([k,l,ic])=>`<button class="tab ${t===k?'on':''}" data-tab="${k}" aria-current="${t===k?'page':'false'}">${ic}<span>${l}</span></button>`).join('');
}
function header(title, sub, opts={}){
  hdrIn.innerHTML =
    (opts.back ? `<button class="icon-btn" data-act="back" aria-label="返回">${I.back}</button>` : '') +
    `<div class="hdr-title">${title}${sub?`<span class="hdr-sub">${sub}</span>`:''}</div>` +
    (opts.right||'');
}

  <div class="search-box">
    <label class="search-field" for="q">${I.search}
      <input id="q" type="search" inputmode="search" autocomplete="off" placeholder="輸入韓文或中文，例如 에서、醫院" value="${esc(S.q)}" aria-label="搜尋文法與例句">
      <button class="clear-q" data-act="clearq" aria-label="清除" ${S.q?'':'hidden'}>${I.x}</button>
    </label>
  </div>
  <div id="results"></div>`;
  const inp = $('#q');
  let t; inp.addEventListener('input', ()=>{ clearTimeout(t); t=setTimeout(()=>{ S.q = inp.value.trim(); $('.clear-q').hidden=!S.q; renderResults(); }, 120); });
  renderResults();
}
function renderResults(){
  const box = $('#results'); if(!box) return;
  const q = S.q;
  if(!q){
    box.innerHTML = `<div class="res-h">試試看</div><div class="suggest">${['에서','까지','比起','一起','病院','아파요','만'].map(s=>`<button data-q="${esc(s)}">${esc(s)}</button>`).join('')}</div>`;
    return;
  }
  const ql = q.toLowerCase();
  const gs = G.filter(g=>(g.title+' '+g.meaning+' '+g.cat.zh).toLowerCase().includes(ql));
  const es = EX.filter(e=>(e.ko+' '+e.zh+' '+(e.gl||[]).map(x=>x.join(' ')).join(' ')+' '+e.hj.map(x=>x.join(' ')).join(' ')).toLowerCase().includes(ql));
  if(!gs.length && !es.length){ box.innerHTML = `<div class="empty">找不到「${esc(q)}」<br>換個關鍵字，或只輸入一部分試試。</div>`; return; }
  box.innerHTML =
    (gs.length?`<div class="res-h">文法 ${gs.length}</div><div class="rows">${gs.map(g=>rowHtml(g,true)).join('')}</div>`:'') +
    (es.length?`<div class="res-h">例句 ${es.length}${es.length>60?'（顯示前 60 句）':''}</div>` + es.slice(0,60).map(e=>`
      <button class="hit" data-go="${e.g.id}" data-ex="${e.i}">
        <div class="ko" lang="ko">${markQ(e.ko,q)}</div>
        <div class="zh">${markQ(e.zh,q)}</div>
        <div class="from">${e.g.cat.zh} ${e.g.no} · <span class="ko">${esc(e.g.title)}</span></div>
      </button>`).join(''):'');
}

function vFav(){
  header('我的收藏', '');
  const list = G.filter(g=> S.favTab==='star' ? S.star.has(g.id) : S.done.has(g.id));
  view.innerHTML = `
  <div class="segwide" role="tablist">
    <button role="tab" data-fav="star" class="${S.favTab==='star'?'on':''}" aria-selected="${S.favTab==='star'}">收藏 ${S.star.size}</button>
    <button role="tab" data-fav="done" class="${S.favTab==='done'?'on':''}" aria-selected="${S.favTab==='done'}">已熟記 ${S.done.size}</button>
  </div>
  ${list.length ? `<div class="rows">${list.map(g=>rowHtml(g,true)).join('')}</div>`
   : `<div class="empty">${S.favTab==='star'?'還沒有收藏的文法。<br>在文法頁右上角點星星，就會出現在這裡。':'還沒有標記熟記的文法。<br>複習完一個文法，點「我記住這個文法了」。'}</div>`}`;
}

let card = null, cardCount = 0;
function pool(){ return EX.filter(e=> !e.bad && (S.scope==='all' || e.g.cat.key===S.scope)); }
function drawCard(){
  const p = pool(); if(!p.length){ card=null; return; }
  let n; do{ n = p[Math.floor(Math.random()*p.length)]; }while(p.length>1 && card && n===card);
  card = n; cardCount++;
}
function vReview(){
  header('隨機複習', '');
  if(!CATS.some(c=>c.key===S.scope && c.ready) && S.scope!=='all') S.scope='all';
  if(!card || (S.scope!=='all' && card.g.cat.key!==S.scope)) drawCard();
  const e = card;
  view.innerHTML = `
  <div class="scope" role="group" aria-label="複習範圍">
    <button data-scope="all" class="${S.scope==='all'?'on':''}">全部</button>
    ${CATS.map(c=>`<button data-scope="${c.key}" class="${S.scope===c.key?'on':''}" ${c.ready?'':'disabled'}>${c.zh}${c.ready?'':'（整理中）'}</button>`).join('')}
  </div>
  ${voiceHint()}
  ${e ? `
  <div class="flash-card" id="fc" data-act="flip" role="button" tabindex="0" aria-label="翻面看答案">
    <div class="fc-top"><span class="fc-count">第 ${cardCount} 張 · 共 ${pool().length} 句</span>
      <button class="say" data-act="saycard" aria-label="朗讀這句">${I.speak}</button></div>
    <p class="fc-ko ko" lang="ko">${markKo(e.ko,e.hl,e.g.id)}</p>
    <div class="fc-hint">點卡片看翻譯</div>
    <div class="fc-back">
      <div class="fc-zh">${esc(e.zh)}</div>
      ${hjHtml(e)}
      <div class="fc-g"><span class="stamp">文法 <b>${e.g.no}</b></span><span>${e.g.cat.zh}</span><span class="ko">${esc(e.g.title)}</span></div>
      ${e.u.label?`<div class="fc-usage">${esc(e.u.label)}</div>`:''}
    </div>
  </div>
  <div class="fc-actions">
    <button class="btn ghost" data-go="${e.g.id}" data-ex="${e.i}">看這個文法</button>
    <button class="btn primary" data-act="next">${I.shuffle}下一句</button>
  </div>` : `<div class="empty">這個範圍還沒有例句。</div>`}`;
}

/* ================= events ================= */
document.addEventListener('click', ev=>{
  const t = ev.target.closest('button,[data-act],[data-go]');
  if(!t) return;
  if(t.dataset.tab){ const k=t.dataset.tab; go({name:k}, {reset:true}); return; }
  if(t.dataset.cat){ go({name:'list', cat:t.dataset.cat, tab:'home'}); return; }
  if(t.dataset.q!=null){ S.q=t.dataset.q; const i=$('#q'); if(i){ i.value=S.q; } $('.clear-q').hidden=false; renderResults(); return; }
  if(t.dataset.fav){ S.favTab=t.dataset.fav; vFav(); return; }
  if(t.dataset.scope){ if(t.disabled) return; S.scope=t.dataset.scope; LS.set('scope',S.scope); card=null; TTS.stop(); vReview(); return; }
  if(t.dataset.rate){ S.rate=+t.dataset.rate; LS.set('rate',S.rate); view.querySelectorAll('[data-rate]').forEach(b=>{ const on = +b.dataset.rate===S.rate; b.classList.toggle('on',on); b.setAttribute('aria-pressed',on); }); return; }
  if(t.dataset.go!=null && t.dataset.go!==''){
    const fx = t.dataset.ex!=null ? +t.dataset.ex : null;
    go({name:'detail', id:t.dataset.go, tab:tabOf(route)}, {focusEx:fx});
    return;
  }
  const a = t.dataset.act;
  if(!a) return;
  if(a==='back') back();
  else if(a==='say'){ ev.stopPropagation(); speakRow(t.closest('.ex')); }
  else if(a==='reveal'){ if(S.hideZh) t.closest('.ex').classList.toggle('revealed'); }
  else if(a==='playall') playAll();
  else if(a==='hidezh'){
    S.hideZh=!S.hideZh; LS.set('hideZh',S.hideZh);
    t.classList.toggle('on',S.hideZh); t.setAttribute('aria-pressed',S.hideZh);
    const w=$('#exWrap'); if(w){ w.classList.toggle('hidezh',S.hideZh); w.querySelectorAll('.revealed').forEach(x=>x.classList.remove('revealed')); }
  }
  else if(a==='star'||a==='done'){
    const g = GBY[route.id], set = a==='star'?S.star:S.done;
    if(set.has(g.id)) set.delete(g.id); else set.add(g.id);
    saveSets();
    const y = window.scrollY; const playing = !!TTS.queue;
    if(!playing){ vDetail(); window.scrollTo(0,y); }
    else { // keep playback: just refresh the buttons
      view.querySelectorAll(`[data-act="${a}"]`).forEach(b=>{ const on=set.has(g.id); b.classList.toggle('on',on); b.setAttribute('aria-pressed',on); });
      hdrIn.querySelectorAll('[data-act="star"]').forEach(b=>{ const on=S.star.has(g.id); b.classList.toggle('on',on); b.innerHTML=on?I.starF:I.star; });
    }
    toast(a==='star' ? (S.star.has(g.id)?'已加入收藏':'已取消收藏') : (S.done.has(g.id)?'已標記為熟記':'已取消熟記'));
  }
  else if(a==='clearq'){ S.q=''; const i=$('#q'); i.value=''; i.focus(); t.hidden=true; renderResults(); }
  else if(a==='flip'){ $('#fc').classList.toggle('flipped'); }
  else if(a==='saycard'){ ev.stopPropagation(); const s=t.closest('.flash-card'); TTS.speak(card.ko, ()=>{}); }
  else if(a==='next'){ drawCard(); vReview(); if(card) TTS.speak(card.ko, ()=>{}); }
});
document.addEventListener('keydown', ev=>{
  if((ev.key==='Enter'||ev.key===' ') && ev.target.id==='fc'){ ev.preventDefault(); ev.target.classList.toggle('flipped'); }
});
function onScroll(){ $('#hdr').classList.toggle('scrolled', window.scrollY>4); }
window.addEventListener('scroll', onScroll, {passive:true});

TTS.init();
render();
})();
</script>
</body>
</html>
